    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    mix-blend-mode: soft-light;
    opacity: 0.06;
    pointer-events: none;
  }
  #bg-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
    transition: filter 0.9s cubic-bezier(.16,1,.3,1), opacity 0.9s cubic-bezier(.16,1,.3,1);
    opacity: 0.35;
  }
  #bg-shade {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.1), transparent 40%, rgba(0,0,0,0.6));
  }
  #app { position: relative; z-index: 10; min-height: 100vh; }

  .glass-panel {
    position: relative;
    border-radius: 1.5rem;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 8px 30px rgba(0,0,0,0.35);
    transition: box-shadow .4s cubic-bezier(.16,1,.3,1), border-color .4s ease, transform .5s cubic-bezier(.16,1,.3,1);
  }
  .glass-panel-glow { border-color: rgba(255,255,255,0.16); }
  .glass-panel-glow:hover { border-color: rgba(255,255,255,0.32); }

  .enter { animation: enterAnim .6s cubic-bezier(.16,1,.3,1) both; }
  @keyframes enterAnim { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
  }
  @media (min-width: 768px) { header { padding: 20px 40px; } }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
  .logo-badge {
    width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #000;
  }
  nav { display: flex; align-items: center; gap: 4px; font-size: 14px; color: rgba(255,255,255,0.7); }
  .nav-link { padding: 8px 16px; border-radius: 999px; transition: background .2s, color .2s; }
  .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .back-btn {
    position: fixed; left: 24px; top: 80px; z-index: 30;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; font-size: 14px; color: rgba(255,255,255,0.85);
  }
  @media (min-width: 768px) { .back-btn { left: 40px; } }
  .back-btn:hover { transform: translateX(-4px); }

  .home { max-width: 72rem; margin: 0 auto; padding: 128px 24px 96px; }
  @media (min-width: 768px) { .home { padding: 160px 40px 96px; } }
  .home-hero { max-width: 42rem; margin-bottom: 56px; }

  function findSubcategory(variantSlug) {
    for (const cat of subcategoryData.categories) {
      const match = cat.subcategories.find(function (s) { return s.category2_id === variantSlug; });
      if (match) return match;
    }
    return null;
  }

  function getSubcategoryTypes(variantSlug) {
    const sub = findSubcategory(variantSlug);
    return sub ? sub.types : null;
  }

  // A variant only gets the new 4-card explorer once ALL 4 of its JSON types
  // carry a generator that actually exists in generatorRegistry, plus their
  // own non-empty sliders. Falling short on any of the 4 falls back to the
  // variant own single baseline generator/sliders (from the categories data
  // above) — never a partial explorer, never a generic stand-in.
  function isVariantExplorerReady(variantSlug) {
    const sub = findSubcategory(variantSlug);
    if (!sub || sub.types.length !== 4) return false;
    return sub.types.every(function (t) {
      return typeof t.generator === "string" &&
        Object.prototype.hasOwnProperty.call(generatorRegistry, t.generator) &&
        Array.isArray(t.sliders) && t.sliders.length > 0;
    });
  }

  // ---------------------------------------------------------------------
  // WebGL mesh-gradient shader
  // ---------------------------------------------------------------------
  const VERT_SHADER =
    "attribute vec2 aPosition;\n" +
    "void main() {\n" +
    "  gl_Position = vec4(aPosition, 0.0, 1.0);\n" +
    "}\n";

  const FRAG_SHADER =
    "precision highp float;\n" +
    "uniform vec2 uResolution;\n" +
    "uniform float uTime;\n" +
    "uniform float uSpeed;\n" +
    "uniform float uGlow;\n" +
    "uniform float uSeed;\n" +
    "uniform vec3 uColor1;\n" +
    "uniform vec3 uColor2;\n" +
    "uniform vec3 uColor3;\n" +
    "uniform vec3 uColor4;\n" +
    "vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }\n" +
    "vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }\n" +
    "vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }\n" +
    "float snoise(vec2 v) {\n" +
    "  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);\n" +
    "  vec2 i  = floor(v + dot(v, C.yy));\n" +
    "  vec2 x0 = v - i + dot(i, C.xx);\n" +
    "  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);\n" +
    "  vec4 x12 = x0.xyxy + C.xxzz;\n" +
    "  x12.xy -= i1;\n" +
    "  i = mod289(i);\n" +
    "  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));\n" +
    "  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);\n" +
    "  m = m * m;\n" +
    "  m = m * m;\n" +
    "  vec3 x = 2.0 * fract(p * C.www) - 1.0;\n" +
    "  vec3 h = abs(x) - 0.5;\n" +
    "  vec3 ox = floor(x + 0.5);\n" +
    "  vec3 a0 = x - ox;\n" +
    "  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);\n" +
    "  vec3 g;\n" +
    "  g.x = a0.x * x0.x + h.x * x0.y;\n" +
    "  g.yz = a0.yz * x12.xz + h.yz * x12.yw;\n" +
    "  return 130.0 * dot(m, g);\n" +
    "}\n" +
    "float fbm(vec2 p) {\n" +
    "  float value = 0.0;\n" +
    "  float amp = 0.5;\n" +
    "  for (int i = 0; i < 4; i++) {\n" +
    "    value += amp * snoise(p);\n" +
    "    p *= 2.02;\n" +
    "    amp *= 0.55;\n" +
    "  }\n" +
    "  return value;\n" +
    "}\n" +
    "float blobField(vec2 uv, vec2 center, float radius) {\n" +
    "  float d = length(uv - center);\n" +
    "  return smoothstep(radius, radius * 0.05, d);\n" +
    "}\n" +
    "void main() {\n" +
    "  vec2 uv = gl_FragCoord.xy / uResolution.xy;\n" +
    "  vec2 p = uv * 2.0 - 1.0;\n" +
    "  p.x *= uResolution.x / uResolution.y;\n" +
    "  float t = uTime * uSpeed * 0.06;\n" +
    "  float seed = uSeed * 13.7;\n" +
    "  vec2 warp = vec2(\n" +
    "    fbm(p * 1.1 + vec2(seed, t)),\n" +
    "    fbm(p * 1.1 + vec2(t * 0.8, seed + 4.2))\n" +
    "  );\n" +
    "  vec2 wp = p + warp * 0.6;\n" +
    "  float field = fbm(wp * 1.3 + vec2(seed * 0.3, t * 0.5));\n" +
    "  field = field * 0.5 + 0.5;\n" +
    "  vec3 base = mix(uColor1, uColor2, smoothstep(0.15, 0.55, field));\n" +
    "  base = mix(base, uColor3, smoothstep(0.45, 0.8, field));\n" +
    "  base = mix(base, uColor4, smoothstep(0.72, 1.0, field));\n" +
    "  vec2 b1 = vec2(sin(t * 0.9 + seed) * 0.5, cos(t * 0.7 + seed) * 0.4);\n" +
    "  vec2 b2 = vec2(cos(t * 0.6 + seed * 1.7) * 0.55, sin(t * 1.1 + seed * 0.9) * 0.5);\n" +
    "  vec2 b3 = vec2(sin(t * 0.5 + seed * 2.3) * 0.4, cos(t * 0.4 + seed * 1.3) * 0.55);\n" +
    "  float pool1 = blobField(wp, b1, 0.85);\n" +
    "  float pool2 = blobField(wp, b2, 0.75);\n" +
    "  float pool3 = blobField(wp, b3, 0.65);\n" +
    "  vec3 color = base;\n" +
    "  color = mix(color, uColor2, pool1 * 0.35);\n" +
    "  color = mix(color, uColor4, pool2 * 0.3);\n" +
    "  color = mix(color, uColor1, pool3 * 0.25);\n" +
    "  float vignette = smoothstep(1.35, 0.2, length(p));\n" +
    "  color *= mix(0.72, 1.0, vignette);\n" +
    "  color += uGlow * 0.12 * (base + 0.3);\n" +
    "  float grain = (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.02;\n" +
    "  color += grain;\n" +
    "  gl_FragColor = vec4(color, 1.0);\n" +
    "}\n";

  function compileShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error("Shader compile error:", gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function createMeshGradient(canvas, opts) {
    const speed = opts.speed != null ? opts.speed : 1;
    const seed = opts.seed != null ? opts.seed : Math.PI;
    let colors = (opts.colors || AMBIENT_COLORS).map(hexToRgbNorm);
    let target = colors.map(function (c) { return c.slice(); });
    let glow = 0;

    const gl = canvas.getContext("webgl", { antialias: true });
    if (!gl) return { setColors: function () {}, setGlow: function () {}, destroy: function () {} };

    const vertShader = compileShader(gl, gl.VERTEX_SHADER, VERT_SHADER);
    const fragShader = compileShader(gl, gl.FRAGMENT_SHADER, FRAG_SHADER);
    const program = gl.createProgram();
    gl.attachShader(program, vertShader);
    gl.attachShader(program, fragShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aPosition = gl.getAttribLocation(program, "aPosition");
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

    const uResolution = gl.getUniformLocation(program, "uResolution");
    const uTime = gl.getUniformLocation(program, "uTime");
    const uSpeed = gl.getUniformLocation(program, "uSpeed");
    const uGlow = gl.getUniformLocation(program, "uGlow");
    const uSeed = gl.getUniformLocation(program, "uSeed");
    const uColor1 = gl.getUniformLocation(program, "uColor1");
    const uColor2 = gl.getUniformLocation(program, "uColor2");
    const uColor3 = gl.getUniformLocation(program, "uColor3");
    const uColor4 = gl.getUniformLocation(program, "uColor4");

    gl.uniform1f(uSeed, seed);
    gl.uniform1f(uSpeed, speed);

    let visible = true;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(1, Math.floor(rect.width * dpr));
      const h = Math.max(1, Math.floor(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
        gl.uniform2f(uResolution, w, h);
      }
    }
    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(canvas);
    resize();

    const intersectionObserver = new IntersectionObserver(
      function (entries) { visible = entries[0] ? entries[0].isIntersecting : true; },
      { threshold: 0.01 }
    );
    intersectionObserver.observe(canvas);

    let raf = 0;
    const start = performance.now();
    function render(now) {
      raf = requestAnimationFrame(render);
      if (!visible) return;
      const t = (now - start) / 1000;
      for (let i = 0; i < 4; i++) {
        for (let k = 0; k < 3; k++) {
          colors[i][k] += (target[i][k] - colors[i][k]) * 0.04;
        }
      }
      gl.uniform1f(uTime, t);
      gl.uniform1f(uGlow, glow);
      gl.uniform3f(uColor1, colors[0][0], colors[0][1], colors[0][2]);
      gl.uniform3f(uColor2, colors[1][0], colors[1][1], colors[1][2]);
      gl.uniform3f(uColor3, colors[2][0], colors[2][1], colors[2][2]);
      gl.uniform3f(uColor4, colors[3][0], colors[3][1], colors[3][2]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    raf = requestAnimationFrame(render);

    return {
      setColors: function (newColors) { target = newColors.map(hexToRgbNorm); },
      setGlow: function (v) { glow = v; },
      destroy: function () {
        cancelAnimationFrame(raf);
        resizeObserver.disconnect();
        intersectionObserver.disconnect();
        gl.deleteProgram(program);
        gl.deleteShader(vertShader);
        gl.deleteShader(fragShader);
        gl.deleteBuffer(positionBuffer);
      },
    };
  }

  // Shared grid-iteration helper — the actual "CellularLattice engine" for
  // self-shading-skin's 4 types below. Each factory is a thin per-cell
  // renderer on top of this, not an independent grid implementation.
  function forEachApertureCell(w, h, density, cb) {
    const cols = Math.max(4, Math.round(density));
    const rows = Math.max(2, Math.round(cols * (h / w)));
    const cellW = w / cols, cellH = h / rows;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const cx = col * cellW + cellW / 2;
        const cy = row * cellH + cellH / 2;
        cb(cx, cy, cellW, cellH, row, col, rows, cols);
      }
    }
  }

  // Shared periodic-contour helper — the "WaveContour engine" for
  // thermal-mass-undulation's 4 types below. Draws one filled band whose top
  // edge follows a shaped sine (sharpness blends toward a triangle wave),
  // with an optional high-frequency "detail" wobble for organic irregularity.
  function drawWaveBand(ctx, w, midY, bottomY, amp, phase, freq, sharpness, detail) {
    detail = detail || 0;
    ctx.beginPath();
    ctx.moveTo(0, midY);
    for (let x = 0; x <= w; x += 6) {
      const raw = Math.sin(x * freq + phase);
      const shaped = sharpness > 0 ? Math.sign(raw) * Math.pow(Math.abs(raw), 1 - sharpness * 0.7) : raw;
      const fine = detail > 0 ? Math.sin(x * freq * 2.7 + phase * 1.6) * detail : 0;
      ctx.lineTo(x, midY + shaped * amp + fine * amp);
    }
    ctx.lineTo(w, bottomY);
    ctx.lineTo(0, bottomY);
    ctx.closePath();
  }

  // Shared radial-placement helpers — the "RadialPhyllotaxis engine" for
  // kinetic-folding-petals' 4 types below. forEachRadialPetal evenly spaces N
  // elements around a center; drawPetalOutline is a thin reusable curved
  // "petal blade" path used wherever a type calls for a curved petal rather
  // than a hard-edged fold panel.
  function forEachRadialPetal(cx, cy, count, angleOffset, cb) {
    const angleStep = (2 * Math.PI) / count;
    for (let i = 0; i < count; i++) {
      cb(i, i * angleStep + angleOffset);
    }
  }

  function drawPetalOutline(ctx, cx, cy, angle, length, width) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(length * 0.4, width, length, 0);
    ctx.quadraticCurveTo(length * 0.4, -width, 0, 0);
    ctx.closePath();
    ctx.restore();
  }

  // Shared true-tessellation helpers — the "Voronoi engine" for voronoi's 4
  // types below. makeVoronoiSeeds builds a jittered seed point set;
  // forEachVoronoiCellPixel rasterizes the diagram on a step grid, handing
  // each type its nearest-seed index and edge-proximity value.
  function makeVoronoiSeeds(n, w, h, t, jitterAmt) {
    const rand = mulberry32(Math.floor(n * 977 + jitterAmt * 3100));
    const pts = [];
    for (let i = 0; i < n; i++) {
      const sx = rand();
      const sy = rand();
      pts.push({
        x: (sx + Math.sin(t * 0.15 + i) * 0.02 * jitterAmt) * w,
        y: (sy + Math.cos(t * 0.15 + i * 1.3) * 0.02 * jitterAmt) * h,
      });
    }
    return pts;
  }

  function forEachVoronoiCellPixel(w, h, points, step, cb) {
    for (let gy = 0; gy < h; gy += step) {
      for (let gx = 0; gx < w; gx += step) {
        let best = 0;
        let bestD = Infinity;
        let secondD = Infinity;
        for (let i = 0; i < points.length; i++) {
          const dx = points[i].x - gx;
          const dy = points[i].y - gy;
          const d = dx * dx + dy * dy;
          if (d < bestD) {
            secondD = bestD;
            bestD = d;
            best = i;
          } else if (d < secondD) {
            secondD = d;
          }
        }
        const edge = Math.sqrt(secondD) - Math.sqrt(bestD);
        cb(gx, gy, step, best, edge);
      }
    }
  }

  // forEachPhyllotaxisPoint — golden-angle spiral point placement, the
  // second half of the RadialPhyllotaxis family alongside forEachRadialPetal.
  // Radius grows as sqrt(i) with a fixed golden-angle increment per point —
  // the true phyllotaxis (sunflower-seed) point field. Used by 2 of
  // fibonacci's 4 types; the other 2 (a continuous logarithmic spiral curve,
  // and a vertical stacked-floor tower) are standalone factories since
  // neither placement helper fits a continuous curve or a floor stack.
  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

  function forEachPhyllotaxisPoint(cx, cy, count, scale, cb) {
    for (let i = 0; i < count; i++) {
      const angle = i * GOLDEN_ANGLE;
      const r = scale * Math.sqrt(i);
      cb(i, cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, r, angle);
    }
  }

  // FractalBranching engine — shared recursive-branch walker for
  // fractal-tree's 4 types. Each factory supplies its own start point/
  // direction, angle spread, length ratio and branch count (2 for a binary
  // tree, 3-4 for denser canopy/root spreads); the callback receives each
  // drawn segment so the factory decides its own stroke style and color.
  function walkFractalBranch(x, y, len, angle, depth, maxDepth, t, angleSpread, lengthRatio, branchCount, cb) {
    if (depth <= 0 || len < 2) return;
    const sway = Math.sin(t * 0.6 + depth * 1.3) * 0.06 * (maxDepth - depth + 1);
    const a = angle + sway;
    const x2 = x + Math.cos(a) * len;
    const y2 = y + Math.sin(a) * len;
    cb(x, y, x2, y2, depth, maxDepth);

    if (branchCount <= 2) {
      walkFractalBranch(x2, y2, len * lengthRatio, a - angleSpread, depth - 1, maxDepth, t, angleSpread, lengthRatio, branchCount, cb);
      walkFractalBranch(x2, y2, len * lengthRatio, a + angleSpread, depth - 1, maxDepth, t, angleSpread, lengthRatio, branchCount, cb);
    } else {
      for (let i = 0; i < branchCount; i++) {
        const frac = branchCount === 1 ? 0 : (i / (branchCount - 1)) * 2 - 1;
        walkFractalBranch(x2, y2, len * lengthRatio, a + frac * angleSpread, depth - 1, maxDepth, t, angleSpread, lengthRatio, branchCount, cb);
      }
    }
  }

  // ReactionDiffusion engine — shared Gray-Scott stepper for 3 of
  // reaction-diffusion's 4 types. Each factory owns its own sim instance but
  // reuses this same step/render algorithm; only feedRate/killRate presets
  // and the palette-index mapping differ. Diffusion coefficients 0.16/0.08
  // (not the 1.0/0.5 the old baseline reactionDiffusion factory below still
  // uses) — the larger pair violates the explicit-scheme stability bound for
  // a 4-neighbor Laplacian at this step size and saturates every cell to
  // 0/1 regardless of f/k, which was verified to make all 3 presets
  // converge to the identical pattern before this fix.
  function createReactionDiffusionSim(gw, gh) {
    const N = gw * gh;
    let U = new Float32Array(N).fill(1);
    let V = new Float32Array(N).fill(0);
    let Un = new Float32Array(N);
    let Vn = new Float32Array(N);
    let seeded = false;
    let off = null;
    let offCtx = null;
    let imgData = null;

    const idx = function (x, y) {
      const cx = x < 0 ? 0 : x >= gw ? gw - 1 : x;
      const cy = y < 0 ? 0 : y >= gh ? gh - 1 : y;
      return cy * gw + cx;
    };

    function seedBlobs(count, radius) {
      const rand = mulberry32(42);
      for (let s = 0; s < count; s++) {
        const sx = Math.floor(rand() * gw);
        const sy = Math.floor(rand() * gh);
        for (let y = sy - radius; y <= sy + radius; y++) {
          for (let x = sx - radius; x <= sx + radius; x++) {
            V[idx(x, y)] = 1;
          }
        }
      }
      seeded = true;
    }

    function step(f, k, iterations) {
      if (!seeded) seedBlobs(6, 3);
      for (let iter = 0; iter < iterations; iter++) {
        for (let y = 0; y < gh; y++) {
          for (let x = 0; x < gw; x++) {
            const i = y * gw + x;
            const u = U[i];
            const v = V[i];
            const lapU = U[idx(x - 1, y)] + U[idx(x + 1, y)] + U[idx(x, y - 1)] + U[idx(x, y + 1)] - 4 * u;
            const lapV = V[idx(x - 1, y)] + V[idx(x + 1, y)] + V[idx(x, y - 1)] + V[idx(x, y + 1)] - 4 * v;
            const uvv = u * v * v;
            Un[i] = clamp(u + (0.16 * lapU - uvv + f * (1 - u)), 0, 1);
            Vn[i] = clamp(v + (0.08 * lapV + uvv - (f + k) * v), 0, 1);
          }
        }
        const Utmp = U; U = Un; Un = Utmp;
        const Vtmp = V; V = Vn; Vn = Vtmp;
      }
    }

    function render(ctx, w, h, colorA, colorB) {
      if (!off) {
        off = document.createElement("canvas");
        off.width = gw;
        off.height = gh;
        offCtx = off.getContext("2d");
        imgData = offCtx ? offCtx.createImageData(gw, gh) : null;
      }
      if (imgData && offCtx) {
        const data = imgData.data;
        for (let i = 0; i < N; i++) {
          const val = clamp(U[i] - V[i], 0, 1);
          const color = lerpColor(colorA, colorB, 1 - val);
          const m = color.match(/[\d.]+/g);
          data[i * 4] = m ? +m[0] : 0;
          data[i * 4 + 1] = m ? +m[1] : 0;
          data[i * 4 + 2] = m ? +m[2] : 0;
          data[i * 4 + 3] = 255;
        }
        offCtx.putImageData(imgData, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(off, 0, 0, gw, gh, 0, 0, w, h);
      }
    }

    return { step: step, render: render };
  }

  // SpaceColonization engine — shared vein-growth stepper for vein-flow's 4
  // types. Each factory owns its own attractors/nodes state but all reuse
  // the same growth step: every attractor pulls its single nearest node,
  // nodes advance toward the averaged pull direction, and attractors within
  // kill range are consumed. Factories differ only in where attractors are
  // seeded and where growth starts from.
  function seedInEllipse(rand, cx, cy, rx, ry) {
    for (let tries = 0; tries < 20; tries++) {
      const x = (rand() * 2 - 1) * rx;
      const y = (rand() * 2 - 1) * ry;
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) return { x: cx + x, y: cy + y };
    }
    return { x: cx, y: cy };
  }

  function stepSpaceColonization(nodes, attractors, influenceR, killR, stepLen, iterations) {
    for (let iter = 0; iter < iterations && nodes.length < 900; iter++) {
      const pulls = new Map();
      for (let ai = 0; ai < attractors.length; ai++) {
        const a = attractors[ai];
        let bestI = -1;
        let bestD = influenceR;
        for (let i = 0; i < nodes.length; i++) {
          const dx = a.x - nodes[i].x;
          const dy = a.y - nodes[i].y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < bestD) {
            bestD = d;
            bestI = i;
          }
        }
        if (bestI >= 0) {
          const dx = a.x - nodes[bestI].x;
          const dy = a.y - nodes[bestI].y;
          const d = Math.sqrt(dx * dx + dy * dy) || 1;
          const cur = pulls.get(bestI) || { dx: 0, dy: 0, n: 0 };
          cur.dx += dx / d;
          cur.dy += dy / d;
          cur.n += 1;
          pulls.set(bestI, cur);
        }
      }

      const newNodes = [];
      pulls.forEach(function (v, i) {
        const dx = v.dx / v.n;
        const dy = v.dy / v.n;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        newNodes.push({ x: nodes[i].x + (dx / d) * stepLen, y: nodes[i].y + (dy / d) * stepLen, parent: i });
      });
      for (let ni = 0; ni < newNodes.length; ni++) nodes.push(newNodes[ni]);

      attractors = attractors.filter(function (a) {
        for (let i = 0; i < nodes.length; i++) {
          const dx = a.x - nodes[i].x;
          const dy = a.y - nodes[i].y;
          if (dx * dx + dy * dy < killR * killR) return false;
        }
        return true;
      });
    }
    return { nodes: nodes, attractors: attractors };
  }

  function drawVeinNetwork(ctx, w, h, nodes, palette, baseWidth) {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (n.parent < 0) continue;
      const parent = nodes[n.parent];
      ctx.beginPath();
      ctx.moveTo(parent.x, parent.y);
      ctx.lineTo(n.x, n.y);
      ctx.strokeStyle = lerpColor(palette[1], palette[3], i / Math.max(1, nodes.length));
      ctx.lineWidth = Math.max(0.6, baseWidth * (1 - i / Math.max(1, nodes.length)));
      ctx.lineCap = "round";
      ctx.stroke();
    }
  }

  // ---------------------------------------------------------------------
  // Canvas2D pattern generators (ported 1:1 from the Next.js prototype)
  // ---------------------------------------------------------------------
  const generatorRegistry = {
    selfShadingSkin: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cols = Math.round(p.density);
          const rows = Math.max(2, Math.round(p.density * (h / w)));
          const cellW = w / cols;
          const cellH = h / rows;
          const angleRad = (p.sunAngle / 180) * Math.PI;
          const apertureFactor = 0.25 + 0.55 * (p.sunAngle / 90);
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const cx = col * cellW + cellW / 2;
              const cy = row * cellH + cellH / 2;
              const shimmer = 1 + 0.04 * Math.sin(t * 0.6 + col * 0.9 + row * 1.3);
              const r = Math.min(cellW, cellH) * 0.5 * apertureFactor * shimmer;
              const offsetX = Math.cos(angleRad) * cellW * (p.shadowDepth / 100) * 0.6;
              const offsetY = cellH * (p.shadowDepth / 100) * 0.5;
              ctx.beginPath();
              ctx.ellipse(cx + offsetX * 0.4, cy + offsetY * 0.5, r * 1.15, r * 0.65, 0, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(0,0,0,0.45)";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(cx, cy, r, 0, Math.PI * 2);
              ctx.fillStyle = lerpColor(palette[2], palette[3], (row + col) / (rows + cols));
              ctx.fill();
            }
          }
        },
      };
    },

      return {

          ctx.clearRect(0, 0, w, h);

          const rows = 9;
          const rowH = h / rows;
          const amp = (p.reliefDepth / 100) * rowH * 0.9;
          for (let row = 0; row < rows; row++) {
            const phase = t * 0.35 + row * (p.thermalLag / 100) * 1.6;
            const rowT = clamp(tempNorm + (row / rows - 0.5) * 0.3, 0, 1);
            const color = lerpColor(palette[0], palette[3], rowT);

            ctx.lineTo(0, (row + 1) * rowH);

            ctx.fill();
            ctx.globalAlpha = 1;

    },

    },

    corrugatedThermalSkin: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = "rgba(0,0,0,0.5)";

    rollingTopography: function () {

    origamiFold: function () {

            ctx.strokeStyle = "rgba(0,0,0,0.35)";

    layeredPetalCascade: function () {

            drawWaveBand(ctx, w, midY, (row + 1) * rowH, amp, phase, 0.022, 0);
            ctx.fillStyle = lerpColor(palette[0], palette[3], snapT);
            ctx.fill();
          }
        },
      };
    },

    irisAperture: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cx = w / 2;
          const cy = h / 2;
          const count = Math.max(4, Math.round(p.bladeCount));
          const closeT = clamp(p.closureLevel / 100, 0, 1);
          const speed = 0.2 + (p.responseSpeed / 100) * 0.8;
          const R = Math.min(w, h) * 0.44;
          const flutter = Math.sin(t * speed) * 0.02;
          const rotate = (closeT + flutter) * Math.PI * 0.9;
          forEachRadialPetal(cx, cy, count, 0, function (i, angle) {
            const a0 = angle;
            const a1 = angle + (2 * Math.PI) / count + rotate;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(a0) * R, cy + Math.sin(a0) * R);
            ctx.lineTo(cx + Math.cos(a1) * R, cy + Math.sin(a1) * R);
            ctx.closePath();
            ctx.fillStyle = lerpColor(palette[1], palette[3], i / count);
            ctx.fill();
          });
          const apertureR = R * 0.5 * (1 - closeT);
          if (apertureR > 1) {
            ctx.beginPath();
            ctx.arc(cx, cy, apertureR, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.75)";
            ctx.fill();
          }
        },
      };
    },

    gradientThicknessMembrane: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cx = w / 2;
          const cy = h / 2;
          const count = Math.max(6, Math.round(p.petalCount));
          const gradientT = clamp(p.thicknessGradient / 100, 0, 1);
          const lag = p.responseLag / 100;
          const R = Math.min(w, h) * 0.42;
          forEachRadialPetal(cx, cy, count, 0, function (i, angle) {
            const dirBias = Math.cos(angle) * 0.5 + 0.5;
            const thickness = 0.3 + dirBias * gradientT;
            const wave = Math.sin(t * (0.6 - thickness * 0.4) - dirBias * lag * 3) * 0.5 + 0.5;
            const len = R * (0.35 + wave * (0.65 - thickness * 0.3));
            const width = len * 0.28;
            drawPetalOutline(ctx, cx, cy, angle, len, width);
            ctx.fillStyle = lerpColor(palette[1], palette[3], thickness);
            ctx.fill();
          });
        },
      };
    },

    kineticFoldingPetals: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cx = w / 2, cy = h / 2;
          const R = Math.min(w, h) * 0.38;
          const count = Math.round(p.petalCount);
          for (let i = 0; i < count; i++) {
            const baseAngle = (i * (2 * Math.PI)) / count;
            const windPhase = Math.sin(t * (0.5 + p.windSpeed * 0.06) + i * 0.8);
            const fold = clamp(p.foldAngle + windPhase * p.windSpeed * 1.4, 0, 90);
            const foldRad = (fold / 180) * Math.PI;
            const closeAmount = Math.cos(foldRad);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(baseAngle);
            ctx.scale(1, Math.max(0.15, closeAmount));
            const grad = ctx.createLinearGradient(0, 0, R, 0);
            grad.addColorStop(0, lerpColor(palette[1], palette[3], i / count));
            grad.addColorStop(1, palette[2]);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(R * 0.5, R * 0.22, R, 0);
            ctx.quadraticCurveTo(R * 0.5, -R * 0.22, 0, 0);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
          }
          ctx.beginPath();
          ctx.arc(cx, cy, R * 0.14, 0, Math.PI * 2);
          ctx.fillStyle = palette[0];
          ctx.fill();
        },
      };
    },

    shapeMemoryMembrane: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cols = 10, rows = 6;
          const cellW = w / cols, cellH = h / rows;
          const tempNorm = clamp((p.temperature + 10) / 55, 0, 1);
          const curlNorm = p.curl / 100;
          const stiffnessDamp = 1 - p.stiffness / 140;
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const cx = col * cellW + cellW / 2;
              const cy = row * cellH + cellH / 2;
              const wobble = Math.sin(t * 0.5 + row * 0.6 + col * 0.4) * 0.06;
              const curlAmount = clamp((tempNorm * 0.6 + curlNorm * 0.4 + wobble) * stiffnessDamp, 0, 1);
              const curlRad = curlAmount * Math.PI * 0.9;
              ctx.save();
              ctx.translate(cx, cy);
              ctx.beginPath();
              const strips = 6;
              for (let s = 0; s <= strips; s++) {
                const a = (s / strips) * curlRad - curlRad / 2;
                const rr = cellH * 0.45;
                const x = Math.sin(a) * rr;
                const y = -Math.cos(a) * rr + rr;
                if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = lerpColor(palette[1], palette[3], tempNorm);
              ctx.lineWidth = cellW * 0.5;
              ctx.lineCap = "round";
              ctx.stroke();
              ctx.restore();
            }
          }
        },
      };
    },

    voronoi: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          const n = Math.round(p.cellCount);
          const rand = mulberry32(Math.floor(n * 977 + p.jitter * 31));
          const seeds = [];
          for (let i = 0; i < n; i++) seeds.push({ x: rand(), y: rand() });
          const jitterAmt = p.jitter / 100;
          const pts = seeds.map(function (s, i) {
            return {
              x: (s.x + Math.sin(t * 0.15 + i) * 0.02 * jitterAmt) * w,
              y: (s.y + Math.cos(t * 0.15 + i * 1.3) * 0.02 * jitterAmt) * h,
            };
          });
          const step = 6;
          ctx.clearRect(0, 0, w, h);
          for (let gy = 0; gy < h; gy += step) {
            for (let gx = 0; gx < w; gx += step) {
              let best = 0, bestD = Infinity, secondD = Infinity;
              for (let i = 0; i < pts.length; i++) {
                const dx = pts[i].x - gx, dy = pts[i].y - gy;
                const d = dx * dx + dy * dy;
                if (d < bestD) { secondD = bestD; bestD = d; best = i; }
                else if (d < secondD) { secondD = d; }
              }
              const edge = Math.sqrt(secondD) - Math.sqrt(bestD);
              const isEdge = edge < p.lineWidth * 3;
              ctx.fillStyle = isEdge ? "rgba(0,0,0,0.55)" : lerpColor(palette[1], palette[3], (best % 7) / 7);
              ctx.fillRect(gx, gy, step, step);
            }
          }
        },
      };
    },

    cellularSkinVoronoi: function () {
      return {

          const jitterAmt = p.jitter / 100;
          const pts = makeVoronoiSeeds(n, w, h, t, jitterAmt);
          const poreAlpha = clamp(p.poreOpacity / 100, 0, 1);
          forEachVoronoiCellPixel(w, h, pts, 6, function (gx, gy, step, best, edge) {
            const isEdge = edge < 3;
            ctx.fillStyle = isEdge ? "rgba(0,0,0," + poreAlpha + ")" : lerpColor(palette[1], palette[3], (best % 7) / 7);
            ctx.fillRect(gx, gy, step, step);
          });
        },

    densityGradedVoronoi: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const gradRad = (p.gradientAngle / 180) * Math.PI;
          const dirX = Math.cos(gradRad);
          const dirY = Math.sin(gradRad);
          const contrast = clamp(p.contrastRange / 100, 0, 1);
          const candidates = Math.round(p.baseCellCount) * 4;
          const rand = mulberry32(Math.floor(candidates * 977));
          const pts = [];
          for (let i = 0; i < candidates; i++) {
            const x = rand();
            const y = rand();
            const proj = (x - 0.5) * dirX + (y - 0.5) * dirY;
            const density = clamp(0.2 + (0.5 + proj) * contrast, 0, 1);
            if (rand() < density) {
              pts.push({
                x: (x + Math.sin(t * 0.15 + i) * 0.015) * w,
                y: (y + Math.cos(t * 0.15 + i * 1.3) * 0.015) * h,
              });
            }
          }
          if (pts.length < 3) {
            pts.push({ x: w / 2, y: h / 2 }, { x: w * 0.3, y: h * 0.7 }, { x: w * 0.7, y: h * 0.3 });
          }
          forEachVoronoiCellPixel(w, h, pts, 6, function (gx, gy, step, best, edge) {
            const isEdge = edge < 3;
            ctx.fillStyle = isEdge ? "rgba(0,0,0,0.5)" : lerpColor(palette[1], palette[3], (best % 7) / 7);
            ctx.fillRect(gx, gy, step, step);
          });
        },

    boneVoronoi: function () {

          forEachVoronoiCellPixel(w, h, pts, 5, function (gx, gy, step, best, edge) {

    logarithmicShellSpiral: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cx = w / 2;
          const cy = h / 2;
          const b = Math.log(p.growthRate) / (Math.PI / 2);
          const maxAngle = p.turns * 2 * Math.PI;
          const startR = Math.min(w, h) * 0.02;
          const rot = t * 0.06;
          ctx.beginPath();
          for (let a = 0; a <= maxAngle; a += 0.05) {
            const r = startR * Math.exp(b * a);
            const x = cx + Math.cos(a + rot) * r;
            const y = cy + Math.sin(a + rot) * r;
            if (a === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = lerpColor(palette[2], palette[3], 0.5);
          ctx.lineWidth = 2;
          ctx.stroke();
          const chamberCount = Math.round(p.chamberCount);
          const chamberStep = maxAngle / chamberCount;
          for (let c = 0; c <= chamberCount; c++) {
            const a = c * chamberStep;
            const r = startR * Math.exp(b * a);
            const x = cx + Math.cos(a + rot) * r;
            const y = cy + Math.sin(a + rot) * r;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, y);
            ctx.strokeStyle = lerpColor(palette[1], palette[3], c / chamberCount);
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        },
      };
    },

    phyllotaxisFacade: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cx = w / 2;
          const cy = h / 2;
          const count = Math.round(p.apertureCount);
          const scale = Math.min(w, h) * 0.045 * p.spiralDensity;
          forEachPhyllotaxisPoint(cx, cy, count, scale, function (i, x, y) {
            if (x < 0 || x > w || y < 0 || y > h) return;
            const shimmer = 1 + 0.05 * Math.sin(t * 0.5 + i * 0.3);
            const rad = p.apertureScale * (0.5 + (i / count) * 0.6) * shimmer;
            ctx.beginPath();

    spiralGrowthTower: function () {

        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);

          const taper = p.taperRatio / 100;
          const twist = (p.twistPerFloor / 180) * Math.PI;
          for (let f = 0; f < floors; f++) {
            const fT = f / floors;
            const floorW = w * 0.7 * (1 - taper * fT);
            const offset = Math.sin(f * twist + t * 0.1) * w * 0.12;
            const x0 = (w - floorW) / 2 + offset;
            const y0 = h - (f + 1) * floorH;
            ctx.fillStyle = lerpColor(palette[1], palette[3], fT);
            ctx.fillRect(x0, y0, floorW, floorH * 0.88);
          }
        },

    radialFibonacciLouver: function () {

          forEachPhyllotaxisPoint(cx, cy, count, scale, function (i, x, y, r, angle) {
            if (x < -louverLen || x > w + louverLen || y < -louverLen || y > h + louverLen) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle + Math.PI / 2);
            ctx.fillStyle = lerpColor(palette[1], palette[3], (i % 17) / 17);

    fibonacci: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cx = w / 2, cy = h / 2;
          const count = Math.round(p.pointCount);
          const goldenAngle = ((137.5 + p.angleOffset) / 180) * Math.PI;
          const maxR = Math.min(w, h) * 0.46;
          for (let i = 0; i < count; i++) {
            const r = (p.growthRate * Math.sqrt(i) * maxR) / (p.growthRate * Math.sqrt(count));
            const a = i * goldenAngle + t * 0.05;
            const x = cx + r * Math.cos(a);
            const y = cy + r * Math.sin(a);
            const size = 1.5 + (i / count) * 4;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = lerpColor(palette[1], palette[3], i / count);
            ctx.fill();
          }

    fractalTree: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const maxDepth = Math.round(p.depth);
          const angleRad = (p.branchAngle / 180) * Math.PI;
          function branch(x, y, len, angle, depth) {
            if (depth <= 0 || len < 2) return;
            const sway = Math.sin(t * 0.6 + depth * 1.3) * 0.06 * (maxDepth - depth + 1);
            const a = angle + sway;
            const x2 = x + Math.cos(a) * len;
            const y2 = y + Math.sin(a) * len;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = lerpColor(palette[1], palette[3], 1 - depth / maxDepth);
            ctx.lineWidth = Math.max(1, depth * 0.9);
            ctx.lineCap = "round";
            ctx.stroke();
            branch(x2, y2, len * p.lengthRatio, a - angleRad, depth - 1);
            branch(x2, y2, len * p.lengthRatio, a + angleRad, depth - 1);
          }
          branch(w / 2, h * 0.95, h * 0.22, -Math.PI / 2, maxDepth);
        },
      };
    },

    diffusionLimitedAggregation: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const maxDepth = Math.round(p.growthDepth);
          const branchProb = clamp(p.branchProbability / 100, 0, 1);
          const jitter = p.jitterAmount / 100;
          const rand = mulberry32(Math.floor(maxDepth * 131 + branchProb * 977 + jitter * 313));

          function grow(x, y, len, angle, depth) {
            if (depth <= 0 || len < 1.5) return;
            const sway = (rand() - 0.5) * jitter * 1.2 + Math.sin(t * 0.3 + depth) * 0.03;
            const a = angle + sway;
            const x2 = x + Math.cos(a) * len;
            const y2 = y + Math.sin(a) * len;

              grow(x2, y2, len * 0.7, a + (rand() < 0.5 ? -1 : 1) * (0.5 + rand() * 0.6), depth - 1);
            }
            if (rand() < branchProb * 0.5) {
              grow(x2, y2, len * 0.6, a + (rand() < 0.5 ? -1 : 1) * (0.8 + rand() * 0.6), depth - 1);

    reactionDiffusion: function () {
      const GW = 120, GH = 90, N = GW * GH;
      let U = new Float32Array(N).fill(1);
      let V = new Float32Array(N).fill(0);
      let Un = new Float32Array(N);
      let Vn = new Float32Array(N);
      let seeded = false;
      let off = null, offCtx = null, imgData = null;

      function idx(x, y) {
        const cx = x < 0 ? 0 : x >= GW ? GW - 1 : x;
        const cy = y < 0 ? 0 : y >= GH ? GH - 1 : y;
        return cy * GW + cx;
      }
      function seed() {
        const rand = mulberry32(42);
        for (let s = 0; s < 6; s++) {
          const sx = Math.floor(rand() * GW);
          const sy = Math.floor(rand() * GH);
          for (let y = sy - 3; y <= sy + 3; y++) {
            for (let x = sx - 3; x <= sx + 3; x++) { V[idx(x, y)] = 1; }
          }
        }
        seeded = true;
      }

      return {
        draw: function (ctx, w, h, t, p, palette) {
          if (!seeded) seed();
          if (!off) {
            off = document.createElement("canvas");
            off.width = GW; off.height = GH;
            offCtx = off.getContext("2d");
            imgData = offCtx ? offCtx.createImageData(GW, GH) : null;
          }
          const f = p.feedRate, k = p.killRate;
          const iterations = Math.max(1, Math.round(p.diffusionSpeed));
          for (let iter = 0; iter < iterations; iter++) {
            for (let y = 0; y < GH; y++) {
              for (let x = 0; x < GW; x++) {
                const i = y * GW + x;
                const u = U[i], v = V[i];
                const lapU = U[idx(x - 1, y)] + U[idx(x + 1, y)] + U[idx(x, y - 1)] + U[idx(x, y + 1)] - 4 * u;
                const lapV = V[idx(x - 1, y)] + V[idx(x + 1, y)] + V[idx(x, y - 1)] + V[idx(x, y + 1)] - 4 * v;
                const uvv = u * v * v;
                Un[i] = clamp(u + (1.0 * lapU - uvv + f * (1 - u)), 0, 1);
                Vn[i] = clamp(v + (0.5 * lapV + uvv - (f + k) * v), 0, 1);
              }
            }
            let tmp = U; U = Un; Un = tmp;
            tmp = V; V = Vn; Vn = tmp;
          }
          if (imgData && offCtx && off) {
            const data = imgData.data;
            for (let i = 0; i < N; i++) {
              const val = clamp(U[i] - V[i], 0, 1);
              const color = lerpColor(palette[0], palette[3], 1 - val);
              const m = color.match(/[\d.]+/g);
              data[i * 4] = m ? +m[0] : 0;
              data[i * 4 + 1] = m ? +m[1] : 0;
              data[i * 4 + 2] = m ? +m[2] : 0;
              data[i * 4 + 3] = 255;
            }
            offCtx.putImageData(imgData, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(off, 0, 0, GW, GH, 0, 0, w, h);
          }
        },
      };
    },

    veinFlow: function () {
      let attractors = [];
      let nodes = [];
      let lastDensity = -1;

      function reseed(w, h, density) {
        const rand = mulberry32(Math.floor(density * 97 + 7));
        attractors = [];
        for (let i = 0; i < density; i++) attractors.push({ x: rand() * w, y: rand() * h * 0.92 });
        nodes = [
          { x: w * 0.5, y: h * 0.98, parent: -1 },
          { x: w * 0.3, y: h * 0.99, parent: -1 },
          { x: w * 0.7, y: h * 0.99, parent: -1 },
        ];
        lastDensity = density;
      }

      return {
        draw: function (ctx, w, h, t, p, palette) {
          if (Math.abs(p.density - lastDensity) > 0.5 || nodes.length === 0) reseed(w, h, p.density);

          const influenceR = Math.max(w, h) * 0.18;
          const killR = Math.max(w, h) * 0.035;
          const stepLen = 5 + p.branchProbability * 0.03;
          const iterations = Math.max(1, Math.round(p.growthSpeed / 2));

          for (let iter = 0; iter < iterations && nodes.length < 900; iter++) {
            const pulls = new Map();
            for (let ai = 0; ai < attractors.length; ai++) {
              const a = attractors[ai];
              let bestI = -1, bestD = influenceR;
              for (let i = 0; i < nodes.length; i++) {
                const dx = a.x - nodes[i].x, dy = a.y - nodes[i].y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bestD) { bestD = d; bestI = i; }
              }
              if (bestI >= 0) {
                const dx = a.x - nodes[bestI].x, dy = a.y - nodes[bestI].y;
                const d = Math.sqrt(dx * dx + dy * dy) || 1;
                const cur = pulls.get(bestI) || { dx: 0, dy: 0, n: 0 };
                cur.dx += dx / d; cur.dy += dy / d; cur.n += 1;
                pulls.set(bestI, cur);
              }
            }
            const newNodes = [];
            pulls.forEach(function (v, i) {
              const dx = v.dx / v.n, dy = v.dy / v.n;
              const d = Math.sqrt(dx * dx + dy * dy) || 1;
              newNodes.push({ x: nodes[i].x + (dx / d) * stepLen, y: nodes[i].y + (dy / d) * stepLen, parent: i });
            });
            for (let ni = 0; ni < newNodes.length; ni++) nodes.push(newNodes[ni]);

            attractors = attractors.filter(function (a) {
              for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                const dx = a.x - n.x, dy = a.y - n.y;
                if (dx * dx + dy * dy < killR * killR) return false;
              }
              return true;
            });
          }

          ctx.clearRect(0, 0, w, h);
          for (let i = 0; i < nodes.length; i++) {
            const n = nodes[i];
            if (n.parent < 0) continue;
            const parent = nodes[n.parent];
            ctx.beginPath();
            ctx.moveTo(parent.x, parent.y);
            ctx.lineTo(n.x, n.y);
            ctx.strokeStyle = lerpColor(palette[1], palette[3], i / Math.max(1, nodes.length));
            ctx.lineWidth = Math.max(0.6, 2.4 * (1 - i / Math.max(1, nodes.length)));
            ctx.lineCap = "round";
            ctx.stroke();
          }
          ctx.fillStyle = rgba(palette[3], 0.5);
          for (let i = 0; i < attractors.length; i++) {
            const a = attractors[i];
            ctx.beginPath();
            ctx.arc(a.x, a.y, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
        },
      };
    },

    structuralGeometry: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const n = Math.round(p.gridDensity);
          const cellW = w / n, cellH = h / n;
          const angleRad = (p.loadAngle / 180) * Math.PI;
          const dir = { x: Math.cos(angleRad), y: Math.sin(angleRad) };
          const cx = w / 2, cy = h / 2;

          function displace(x, y) {
            const rx = x - cx, ry = y - cy;
            const proj = rx * dir.x + ry * dir.y;
            const dist = Math.sqrt(rx * rx + ry * ry) || 1;
            const falloff = Math.exp(-Math.pow(dist / (Math.min(w, h) * 0.5), 2));
            const mag = Math.sin(proj * 0.04 + t * 0.4) * falloff * cellW * 0.35;
            return { x: x + dir.y * mag, y: y - dir.x * mag, stress: Math.abs(mag) };
          }

          const grid = [];
          for (let j = 0; j <= n; j++) {
            const row = [];
            for (let i = 0; i <= n; i++) row.push(displace(i * cellW, j * cellH));
            grid.push(row);
          }

          ctx.lineWidth = p.memberThickness;
          for (let j = 0; j <= n; j++) {
            for (let i = 0; i <= n; i++) {
              const node = grid[j][i];
              const stressT = clamp(node.stress / (cellW * 0.35), 0, 1);
              ctx.strokeStyle = lerpColor(palette[1], palette[3], stressT);
              if (i < n) {
                const right = grid[j][i + 1];
                ctx.beginPath(); ctx.moveTo(node.x, node.y); ctx.lineTo(right.x, right.y); ctx.stroke();
              }
              if (j < n) {
                const down = grid[j + 1][i];
                ctx.beginPath(); ctx.moveTo(node.x, node.y); ctx.lineTo(down.x, down.y); ctx.stroke();
              }
              if (i < n && j < n) {
                const diag = grid[j + 1][i + 1];
                ctx.globalAlpha = 0.4;
                ctx.beginPath(); ctx.moveTo(node.x, node.y); ctx.lineTo(diag.x, diag.y); ctx.stroke();
                ctx.globalAlpha = 1;
              }
            }
          }
        },
      };
    },

    shapeMemoryAlloy: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cols = 10, rows = 6;
          const cellW = w / cols, cellH = h / rows;
          const tempNorm = clamp((p.temperature + 10) / 70, 0, 1);
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const cx = col * cellW + cellW / 2;
              const cy = row * cellH + cellH / 2;
              const wobble = Math.sin(t * 0.5 + row * 0.6 + col * 0.4) * 0.05;
              const curlAmount = clamp(tempNorm + wobble, 0, 1);
              const curlRad = curlAmount * Math.PI * 0.9;
              ctx.save();
              ctx.translate(cx, cy);
              ctx.beginPath();
              const strips = 6;
              for (let s = 0; s <= strips; s++) {
                const a = (s / strips) * curlRad - curlRad / 2;
                const rr = cellH * 0.45;
                const x = Math.sin(a) * rr;
                const y = -Math.cos(a) * rr + rr;
                if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = lerpColor(palette[1], palette[3], tempNorm);
              ctx.lineWidth = cellW * 0.5;
              ctx.lineCap = "round";
              ctx.stroke();
              ctx.restore();
            }
          }
        },
      };
    },

    hygromorphicMembrane: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cols = 8, rows = 5;
          const cellW = w / cols, cellH = h / rows;
          const humidityNorm = clamp(p.humidity / 100, 0, 1);
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const baseX = col * cellW + cellW / 2;
              const topY = row * cellH + cellH * 0.1;
              const bottomY = row * cellH + cellH * 0.9;
              const sway = Math.sin(t * 0.4 + row * 0.5 + col * 0.3) * 0.12;
              const bend = clamp(humidityNorm + sway, 0, 1) * cellW * 0.4;
              const midY = (topY + bottomY) / 2;
              ctx.beginPath();
              ctx.moveTo(baseX - cellW * 0.3, topY);
              ctx.quadraticCurveTo(baseX - cellW * 0.3 + bend, midY, baseX - cellW * 0.3, bottomY);
              ctx.lineTo(baseX + cellW * 0.3, bottomY);
              ctx.quadraticCurveTo(baseX + cellW * 0.3 + bend, midY, baseX + cellW * 0.3, topY);
              ctx.closePath();
              ctx.fillStyle = lerpColor(palette[1], palette[2], row / rows);
              ctx.fill();
              ctx.strokeStyle = rgba(palette[0], 0.35);
              ctx.lineWidth = 1;
              for (let g = 1; g < 4; g++) {
                const gx = baseX - cellW * 0.3 + (cellW * 0.6 * g) / 4;
                ctx.beginPath();
                ctx.moveTo(gx, topY);
                ctx.quadraticCurveTo(gx + bend, midY, gx, bottomY);
                ctx.stroke();
              }
            }
          }
        },
      };
    },

    bimetallicStrip: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const rows = 10;
          const rowH = h / rows;
          const tempNorm = clamp((p.temperature + 10) / 70, 0, 1);
          const cx = w / 2, len = w * 0.92;
          for (let row = 0; row < rows; row++) {
            const cy = row * rowH + rowH / 2;
            const wobble = Math.sin(t * 0.5 + row * 0.7) * 0.05;
            const tilt = clamp(tempNorm + wobble, 0, 1) * (Math.PI / 2.4) - Math.PI / 4.8;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(tilt);
            ctx.fillStyle = lerpColor(palette[1], palette[3], tempNorm);
            ctx.fillRect(-len / 2, -rowH * 0.22, len, rowH * 0.22);
            ctx.fillStyle = rgba(palette[0], 0.55);
            ctx.fillRect(-len / 2, 0, len, rowH * 0.18);
            ctx.restore();
          }
        },
      };
    },

    pneumaticMembrane: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const cols = 5, rows = 4;
          const cellW = w / cols, cellH = h / rows;
          const pressureNorm = clamp(p.pressure / 100, 0, 1);
          const pad = Math.min(cellW, cellH) * 0.08;
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const cx = col * cellW + cellW / 2;
              const cy = row * cellH + cellH / 2;
              const breathe = 1 + 0.03 * Math.sin(t * 0.8 + row + col);
              const inflate = (0.35 + pressureNorm * 0.55) * breathe;
              const rw = (cellW / 2 - pad) * (0.7 + inflate * 0.3);
              const rh = (cellH / 2 - pad) * (0.7 + inflate * 0.3);
              const grad = ctx.createRadialGradient(cx - rw * 0.3, cy - rh * 0.3, 1, cx, cy, Math.max(rw, rh));
              grad.addColorStop(0, lerpColor(palette[3], "#ffffff", 0.15 + inflate * 0.25));
              grad.addColorStop(1, lerpColor(palette[1], palette[2], 1 - inflate));
              ctx.beginPath();
              ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2);
              ctx.fillStyle = grad;
              ctx.fill();
              ctx.strokeStyle = rgba(palette[0], 0.4);
              ctx.lineWidth = 1.5;
              ctx.stroke();
            }
          }
        },
      };
    },

    // ---- CellularLattice engine: self-shading-skin's 4 types ----

    fixedApertureGrid: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const angleRad = (p.sunAngle / 180) * Math.PI;
          forEachApertureCell(w, h, p.apertureDensity, function (cx, cy, cellW, cellH, row, col, rows, cols) {
            const shimmer = 1 + 0.03 * Math.sin(t * 0.5 + col * 0.9 + row * 1.3);
            const r = Math.min(cellW, cellH) * 0.5 * (p.apertureSize / 100) * shimmer;
            const offsetX = Math.cos(angleRad) * cellW * 0.5;
            const offsetY = Math.sin(angleRad) * cellH * 0.5;
            ctx.beginPath();
            ctx.ellipse(cx + offsetX * 0.4, cy + offsetY * 0.4, r * 1.15, r * 0.65, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.45)";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = lerpColor(palette[2], palette[3], (row + col) / (rows + cols));
            ctx.fill();
          });
        },
      };
    },

    deepWellShadow: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const angleRad = (p.sunAngle / 180) * Math.PI;
          const depth = clamp(p.wellDepth / 100, 0, 1);
          const noonFactor = Math.sin(angleRad);
          forEachApertureCell(w, h, p.apertureDensity, function (cx, cy, cellW, cellH, row, col) {
            const shimmer = 1 + 0.03 * Math.sin(t * 0.5 + col * 0.9 + row * 1.3);
            const r = Math.min(cellW, cellH) * 0.42 * shimmer;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fill();
            const rings = 1 + Math.round(depth * 3);
            for (let ring = rings; ring >= 1; ring--) {
              const ringR = r * (1 - ring / (rings + 1));
              ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(0,0,0," + (0.75 - ring * 0.12) + ")"; ctx.fill();
            }
            const floorR = r * Math.max(0.08, (1 - depth) * 0.5);
            ctx.beginPath(); ctx.arc(cx, cy, floorR, 0, Math.PI * 2);
            ctx.fillStyle = lerpColor(palette[0], palette[3], noonFactor);
            ctx.globalAlpha = 0.3 + noonFactor * 0.7; ctx.fill(); ctx.globalAlpha = 1;
          });
        },
      };
    },

    directionalLouverAperture: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const angleRad = (p.louverAngle / 180) * Math.PI;
          const slitFrac = clamp(p.slitWidth / 100, 0.05, 1);
          forEachApertureCell(w, h, p.apertureDensity, function (cx, cy, cellW, cellH, row, col) {
            const wobble = Math.sin(t * 0.4 + row * 0.6 + col * 0.3) * 0.02;
            const len = Math.min(cellW, cellH) * 0.85;
            const thick = Math.min(cellW, cellH) * 0.5 * slitFrac;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(angleRad + wobble);
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(-len / 2, -thick * 0.6, len, thick * 0.6);
            ctx.fillStyle = lerpColor(palette[2], palette[3], (row + col) / 20);
            ctx.fillRect(-len / 2, 0, len, thick * 0.4);
            ctx.restore();
          });
        },
      };
    },

    graduatedPinhole: function () {
      return {
        draw: function (ctx, w, h, t, p, palette) {
          ctx.clearRect(0, 0, w, h);
          const angleRad = (p.gradientAngle / 180) * Math.PI;
          const dir = { x: Math.cos(angleRad), y: Math.sin(angleRad) };
          const contrast = clamp(p.contrastRange / 100, 0, 1);
          forEachApertureCell(w, h, p.pinholeDensity, function (cx, cy, cellW, cellH, row, col) {
            const proj = (cx / w) * dir.x + (cy / h) * dir.y;
            const grade = clamp((proj + 1) / 2, 0, 1);
            const jitter = 1 + 0.05 * Math.sin(t * 0.5 + row + col);
            const r = Math.min(cellW, cellH) * 0.5 * (0.08 + grade * contrast) * jitter;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = lerpColor(palette[1], palette[3], grade);
            ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
          });
        },
      };
    },
  };

  function createGenerator(key) {
    const factory = generatorRegistry[key];
    return factory ? factory() : generatorRegistry.voronoi();
  }

  function formatVal(val, slider) {
    const isInt = Number.isInteger(slider.step);
    const text = isInt ? String(val) : val.toFixed(3);
    return text + (slider.unit || "");
  }

  function renderVariant(slug, variantSlug) {
    cleanup();
    const found = getVariant(slug, variantSlug);
    const cat = found.category, v = found.variant;
    if (!cat || !v) { location.hash = ""; return; }
    setScene(cat.colors, "variant");

    // This variant only gets the JSON-driven 4-card explorer if ALL 4 of its
    // types have a real registered generator + their own sliders. Otherwise
    // it falls back to its own single baseline generator/sliders (from the
    // categories data) — never a partial explorer, never a generic stand-in.
    const explorerReady = isVariantExplorerReady(variantSlug);
    const jsonTypes = explorerReady ? getSubcategoryTypes(variantSlug) : null;
    const explorerTypes = (jsonTypes || []).map(function (t) {
      return {
        key: t.slug || String(t.id),
        label: t.name,
        examples: t.example,
        description: t.description,
        generator: t.generator,
        sliders: t.sliders,
      };
    });

    const fallbackGenerator = v.generator;
    const fallbackSliders = v.sliders;
    const explorerSliders = explorerReady ? explorerTypes[0].sliders : fallbackSliders;

    appEl.innerHTML =
      '<div class="variant-screen">' +
      '<button class="glass-panel back-btn enter" id="back-btn"><span aria-hidden="true">&larr;</span> Back</button>' +
      '<div class="variant-head enter">' +
      '<p class="eyebrow">' + cat.title.toUpperCase() + " &middot; VARIANT " + v.index + "</p>" +
      "<h1>" + v.title + ' <span class="zh">' + v.titleZh + "</span></h1>" +
      "<p>" + v.description + "</p>" +
      "</div>" +
      '<div class="variant-body enter" style="animation-delay:.15s">' +
      (explorerReady
        ? '<div class="mechanism-list">' +
          '<div class="mechanism-title">MECHANISM TYPE</div>' +
          '<div id="mechanism-cards"></div>' +
          "</div>"
        : "") +
      '<div class="playground-col"' + (explorerReady ? "" : ' style="width:100%;"') + '>' +
      '<div class="playground">' +
      '<div class="glass-panel playground-canvas-wrap"><canvas id="playground-canvas"></canvas></div>' +
      '<div class="glass-panel params-panel">' +
      '<div class="params-title">PARAMETERS</div>' +
      '<div id="params-list"></div>' +
      "</div></div></div></div></div>";

    document.getElementById("back-btn").addEventListener("click", function () { location.hash = "#/category/" + cat.slug; });

    // Shared params object: read live by the main canvas AND all mini previews
    // (when the explorer is showing), so dragging a slider updates everything.
    const params = {};
    explorerSliders.forEach(function (s) { params[s.key] = s.default; });

    function rebuildParamsPanel(sliders) {
      const list = document.getElementById("params-list");
      list.innerHTML = "";
      Object.keys(params).forEach(function (k) { delete params[k]; });
      sliders.forEach(function (s) {
        params[s.key] = s.default;
        const row = document.createElement("div");
        row.className = "param-row";
        row.innerHTML =
          '<div class="param-label-row"><label>' + s.label + '</label><span class="param-value" id="val-' + s.key + '">' +
          formatVal(params[s.key], s) + "</span></div>" +
          '<input type="range" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + params[s.key] + '" id="input-' + s.key + '">';
        list.appendChild(row);
        row.querySelector("input").addEventListener("input", function (e) {
          const val = parseFloat(e.target.value);
          params[s.key] = val;
          document.getElementById("val-" + s.key).textContent = formatVal(val, s);
        });
      });
    }
    rebuildParamsPanel(explorerSliders);

    // Main preview canvas: generator instance is (re)created whenever the
    // active mechanism type changes, so stateful generators reset cleanly.
    const canvas = document.getElementById("playground-canvas");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    }
    resize();
    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(canvas);
    cleanupFns.push(function () { resizeObserver.disconnect(); });

    let mainRaf = 0;
    function startMainCanvas(generatorKey) {
      cancelAnimationFrame(mainRaf);
      const generator = createGenerator(generatorKey);
      const start = performance.now();
      function loop(now) {
        mainRaf = requestAnimationFrame(loop);
        const t = (now - start) / 1000;
        generator.draw(ctx, canvas.width, canvas.height, t, params, cat.colors);
      }
      mainRaf = requestAnimationFrame(loop);
    }
    cleanupFns.push(function () { cancelAnimationFrame(mainRaf); });

    if (!explorerReady) {
      startMainCanvas(fallbackGenerator);
      return;
    }

    // Left-panel mechanism cards, each with its own tiny live preview.
    let activeTypeKey = explorerTypes[0].key;
    const cardsEl = document.getElementById("mechanism-cards");
    const cardButtons = {};

    explorerTypes.forEach(function (type) {
      const card = document.createElement("button");
      card.className = "glass-panel glass-panel-glow mechanism-card";
      card.innerHTML =
        '<div class="mechanism-preview"><canvas></canvas></div>' +
        '<div class="mechanism-info"><h4>' + type.label + "</h4><p>" + type.examples + "</p>" +
        (type.description ? '<p class="mechanism-desc">' + type.description + "</p>" : "") +
        "</div>";
      card.addEventListener("click", function () {
        if (activeTypeKey === type.key) return;
        activeTypeKey = type.key;
        Object.keys(cardButtons).forEach(function (k) { cardButtons[k].classList.toggle("active", k === activeTypeKey); });
        rebuildParamsPanel(type.sliders);
        startMainCanvas(type.generator);
      });
      cardsEl.appendChild(card);
      cardButtons[type.key] = card;

      // Each mini preview uses its OWN static default params (computed once),
      // never the shared `params` object — so an unselected card never reads
      // a slider key that belongs to whichever type is currently active.
      const miniParams = {};
      type.sliders.forEach(function (s) { miniParams[s.key] = s.default; });

      const miniCanvas = card.querySelector("canvas");
      const miniCtx = miniCanvas.getContext("2d");
      const miniGenerator = createGenerator(type.generator);
      const miniDpr = 1;

      function miniResize() {
        const rect = miniCanvas.getBoundingClientRect();
        miniCanvas.width = Math.max(1, Math.floor(rect.width * miniDpr));
        miniCanvas.height = Math.max(1, Math.floor(rect.height * miniDpr));
      }
      miniResize();
      const miniResizeObserver = new ResizeObserver(miniResize);
      miniResizeObserver.observe(miniCanvas);

      let miniRaf = 0;
      const miniStart = performance.now();
      function miniLoop(now) {
        miniRaf = requestAnimationFrame(miniLoop);
        const t = (now - miniStart) / 1000;
        miniGenerator.draw(miniCtx, miniCanvas.width, miniCanvas.height, t, miniParams, cat.colors);
      }
      miniRaf = requestAnimationFrame(miniLoop);

      cleanupFns.push(function () { cancelAnimationFrame(miniRaf); miniResizeObserver.disconnect(); });
    });

    cardButtons[activeTypeKey].classList.add("active");
    startMainCanvas(explorerTypes[0].generator);
  }

  function route() {
    const hash = location.hash.replace(/^#\/?/, "");
    const parts = hash.split("/").filter(Boolean);
    if (parts[0] === "about") renderAbout();
    else if (parts[0] === "docs") renderDocs();
    else if (parts[0] === "category" && parts[1] && parts[2]) renderVariant(parts[1], parts[2]);
    else if (parts[0] === "category" && parts[1]) renderCategory(parts[1]);
    else renderHome();
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
